# Gitea Actions — публикация релиза при пуше тега v*
#
# release: сборка прошивок (plain + OTA) и создание релиза в Gitea
#          с артефактами (bin/elf/map, ota_0 image, flasher_args.json, tar.bz2)
# latest:  обновляет тег latest на commit последнего релиза (Gitea поддерживает
#          перемещаемые теги через DELETE + POST)
#
# Auth: используется встроенный secrets.GITHUB_TOKEN, выдаваемый act_runner.
# Не трогает .github/workflows — конфигурации CI разделены.

name: Release

on:
  push:
    tags:
      - "v*"

env:
  IDF_TARGET: esp32s3
  IDF_IMAGE: espressif/idf:v5.5.1
  API: ${{ github.api_url }}/repos/${{ github.repository }}

jobs:
  release:
    name: Build firmware & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужен для git log между тегами

      - name: Ensure IDF docker helper
        run: |
          set -euo pipefail
          test -f tools/ci/idf-docker.sh
          chmod +x tools/ci/idf-docker.sh

      - name: Build firmware (flashable)
        run: |
          tools/ci/idf-docker.sh . -- set-target "${IDF_TARGET}"
          tools/ci/idf-docker.sh . -- build

      - name: Build firmware (OTA partitions)
        run: |
          # чистый каталог: в существующем build/ SDKCONFIG_DEFAULTS из кэша не переопределяется
          rm -rf build
          tools/ci/idf-docker.sh . -- set-target "${IDF_TARGET}"
          tools/ci/idf-docker.sh . -- -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.ota" build

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          cp build/bootloader/bootloader.bin \
             build/partition_table/partition-table.bin \
             build/embed-framework.bin \
             build/embed-framework.elf \
             build/embed-framework.map \
             build/flasher_args.json out/
          cp build/ota_app_image.bin out/embed-framework-ota.bin
          # .bin → .elf → .map в один tar.bz2 для прошивки/отладки
          tar -C out -cjf "out/embed-framework-${GITHUB_REF_NAME}.tar.bz2" \
            bootloader.bin partition-table.bin embed-framework.bin \
            embed-framework.elf embed-framework.map flasher_args.json
          # все артефакты OTA-сборки одним архивом (dfu/csr)
          tar -C build -cjf out/embed-framework-ota_artifacts.tar.bz2 \
            bootloader partition_table ota_app_image.bin \
            flash_args flasher_args.json sdkconfig
          ls -la out

      - name: Create release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "${PREV_TAG}" ]; then
            CHANGES="$(git log --no-merges --pretty='- %s (%h)' "${PREV_TAG}..${TAG}")"
            COMPARE="${PREV_TAG}...${TAG}"
          else
            CHANGES="$(git log --no-merges --pretty='- %s (%h)' -50)"
            COMPARE=""
          fi

          BODY="## embed-framework ${TAG}

          ### Изменения
          ${CHANGES:-— список изменений пуст}

          ### Артефакты
          - `bootloader.bin`, `partition-table.bin`, `embed-framework.bin` — прошивка (см. flasher_args.json)
          - `embed-framework-ota.bin` — образ для OTA-обновления (ota_0, partitions_ota.csv)
          - `embed-framework-ota_artifacts.tar.bz2` — полная OTA-сборка (sdkconfig, flash_args)
          - `flasher_args.json` — аргументы idf.py program_flash

          ${COMPARE:+[Полный список изменений](${github.server_url}/${github.repository}/compare/${COMPARE})}"

          # escape в JSON через jq недоступен на всех раннерах — python надёжнее
          JSON="$(printf '%s' "${BODY}" | python3 -c 'import json,sys; print(json.dumps({"tag_name": sys.argv[1], "name": "embed-framework " + sys.argv[1], "body": sys.stdin.read()}))' "${TAG}")"

          curl -fsS -X POST "${API}/releases" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${JSON}" > out/release.json
          cat out/release.json

      - name: Upload release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_ID="$(python3 -c 'import json; print(json.load(open("out/release.json"))["id"])')"
          shopt -s nullglob
          for f in out/*; do
            [ "$(basename "$f")" = "release.json" ] && continue
            name="$(basename "$f")"
            curl -fsS -X POST \
              "${API}/releases/${RELEASE_ID}/assets?name=${name}" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}" > /dev/null
            echo "uploaded: ${name}"
          done

  latest:
    name: Move latest tag
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update tag latest
        run: |
          set -euo pipefail
          # Gitea: перемещаемый тег latest = commit последнего релиза
          curl -fsS -X DELETE "${API}/tags/latest" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" || true
          curl -fsS -X POST "${API}/tags" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"latest\", \"target\": {\"old_name\": \"${GITHUB_SHA}\"}}" \
            > /dev/null
          echo "tag latest -> ${GITHUB_REF_NAME} (${GITHUB_SHA::8})"
