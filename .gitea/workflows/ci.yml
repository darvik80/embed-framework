# Gitea Actions (GitHub Actions–compatible YAML for act_runner)
#
# Do NOT set job-level `container: espressif/idf`:
#   actions/checkout needs Node.js (missing in IDF image → exit 126).
#
# Do NOT `docker run -v "$GITHUB_WORKSPACE:..."` on act_runner Docker jobs:
#   workspace path exists only inside the job container, not on the Docker
#   host → "Bind mount failed: '/workspace/...' does not exist" (exit 125).
#   tools/ci/idf-docker.sh uses --volumes-from in that case.
#
# Runner: label ubuntu-latest + access to docker.sock

name: CI

on:
  push:
    branches:
      - master
      - main
      - "feature*"
      - "feature/**"
  pull_request:
  workflow_dispatch:

env:
  IDF_TARGET: esp32s3
  IDF_IMAGE: espressif/idf:v5.5.1

jobs:
  unity-tests:
    name: Build Unity tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build embed_unity
        run: |
          chmod +x tools/ci/idf-docker.sh
          tools/ci/idf-docker.sh test_apps/embed_unity -- set-target "${IDF_TARGET}"
          tools/ci/idf-docker.sh test_apps/embed_unity -- build

      - name: Upload Unity build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: unity-embed-${{ env.IDF_TARGET }}
          path: |
            test_apps/embed_unity/build/*.bin
            test_apps/embed_unity/build/flasher_args.json
          if-no-files-found: warn

  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build project
        run: |
          chmod +x tools/ci/idf-docker.sh
          tools/ci/idf-docker.sh . -- set-target "${IDF_TARGET}"
          tools/ci/idf-docker.sh . -- build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v3
        with:
          name: firmware-${{ env.IDF_TARGET }}
          path: |
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
          if-no-files-found: error

  firmware-ota:
    name: Build firmware (OTA partitions)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with partitions_ota.csv
        run: |
          chmod +x tools/ci/idf-docker.sh
          tools/ci/idf-docker.sh . -- set-target "${IDF_TARGET}"
          tools/ci/idf-docker.sh . -- -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.ota" build

      - name: Upload OTA firmware artifacts
        uses: actions/upload-artifact@v3
        with:
          name: firmware-ota-${{ env.IDF_TARGET }}
          path: |
            build/*.bin
            build/flasher_args.json
          if-no-files-found: error
