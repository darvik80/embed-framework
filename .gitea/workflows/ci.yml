# Gitea Actions (GitHub Actions–compatible YAML for act_runner)
#
# IMPORTANT: do NOT set `container: espressif/idf` on the job.
# actions/checkout and actions/upload-artifact need Node.js; the IDF image
# has no `node` → "exec: node: executable file not found" (exit 126).
#
# Pattern: checkout/artifacts on the runner host; build via `docker run`.
#
# Runner requirements:
#   - label matching runs-on (ubuntu-latest)
#   - Docker available to the runner (privileged / docker.sock)

name: CI

on:
  push:
    branches:
      - master
      - main
      - "feature*"
      - "feature/**"
  pull_request:
  workflow_dispatch:

env:
  IDF_TARGET: esp32s3
  IDF_IMAGE: espressif/idf:v5.5.1

jobs:
  unity-tests:
    name: Build Unity tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build embed_unity (Docker IDF)
        run: |
          docker run --rm \
            -e IDF_TARGET="${IDF_TARGET}" \
            -v "${GITHUB_WORKSPACE}:/project" \
            -w /project/test_apps/embed_unity \
            "${IDF_IMAGE}" \
            bash -lc '
              . /opt/esp/idf/export.sh
              idf.py set-target "${IDF_TARGET}"
              idf.py build
            '

      - name: Upload Unity build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: unity-embed-${{ env.IDF_TARGET }}
          path: |
            test_apps/embed_unity/build/*.bin
            test_apps/embed_unity/build/flasher_args.json
          if-no-files-found: warn

  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build project (Docker IDF)
        run: |
          docker run --rm \
            -e IDF_TARGET="${IDF_TARGET}" \
            -v "${GITHUB_WORKSPACE}:/project" \
            -w /project \
            "${IDF_IMAGE}" \
            bash -lc '
              . /opt/esp/idf/export.sh
              idf.py set-target "${IDF_TARGET}"
              idf.py build
            '

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v3
        with:
          name: firmware-${{ env.IDF_TARGET }}
          path: |
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
          if-no-files-found: error

  firmware-ota:
    name: Build firmware (OTA partitions)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with partitions_ota.csv (Docker IDF)
        run: |
          docker run --rm \
            -e IDF_TARGET="${IDF_TARGET}" \
            -v "${GITHUB_WORKSPACE}:/project" \
            -w /project \
            "${IDF_IMAGE}" \
            bash -lc '
              . /opt/esp/idf/export.sh
              idf.py set-target "${IDF_TARGET}"
              idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.ota" build
            '

      - name: Upload OTA firmware artifacts
        uses: actions/upload-artifact@v3
        with:
          name: firmware-ota-${{ env.IDF_TARGET }}
          path: |
            build/*.bin
            build/flasher_args.json
          if-no-files-found: error
