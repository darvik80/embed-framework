# Gitea Actions (GitHub Actions–compatible YAML for act_runner)
#
# host-tests     — Linux Unity run, no IDF, no flash (primary gate)
# embed-unity    — Docker IDF build of test_apps/embed_unity
# firmware*      — Docker IDF firmware builds
#
# Do NOT use job-level `container: espressif/idf` with actions/checkout (no node).
# Nested docker: tools/ci/idf-docker.sh uses --volumes-from on act_runner.

name: CI

on:
  push:
    branches:
      - master
      - "release*"
      - "release/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  IDF_TARGET: esp32s3
  IDF_IMAGE: espressif/idf:v5.5.1
  API: ${{ github.api_url }}/repos/${{ github.repository }}

jobs:
  host-tests:
    name: Host Unity tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ git

      - name: Configure & build
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          cmake -S host_test -B host_test/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build host_test/build -j"$(nproc)"

      - name: Run tests
        run: ctest --test-dir host_test/build --output-on-failure --verbose

  embed-unity:
    name: Build embed_unity (IDF)
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure IDF docker helper
        run: |
          set -euo pipefail
          test -f tools/ci/idf-docker.sh
          chmod +x tools/ci/idf-docker.sh

      - name: Build embed_unity
        run: |
          tools/ci/idf-docker.sh test_apps/embed_unity -- set-target "${IDF_TARGET}"
          tools/ci/idf-docker.sh test_apps/embed_unity -- build

      - name: Upload embed_unity artifacts
        uses: actions/upload-artifact@v3
        with:
          name: embed-unity-${{ env.IDF_TARGET }}
          path: |
            test_apps/embed_unity/build/*.bin
            test_apps/embed_unity/build/flasher_args.json
          if-no-files-found: warn

  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure IDF docker helper
        run: |
          set -euo pipefail
          if [ ! -f tools/ci/idf-docker.sh ]; then
            echo "tools/ci/idf-docker.sh missing from repo checkout" >&2
            ls -la tools/ci 2>/dev/null || ls -la
            exit 1
          fi
          chmod +x tools/ci/idf-docker.sh

      - name: Build project
        run: |
          tools/ci/idf-docker.sh . -- set-target "${IDF_TARGET}"
          tools/ci/idf-docker.sh . -- build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v3
        with:
          name: firmware-${{ env.IDF_TARGET }}
          path: |
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
          if-no-files-found: error

  firmware-ota:
    name: Build firmware (OTA partitions)
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure IDF docker helper
        run: |
          set -euo pipefail
          test -f tools/ci/idf-docker.sh
          chmod +x tools/ci/idf-docker.sh

      - name: Build with partitions_ota.csv
        run: |
          tools/ci/idf-docker.sh . -- set-target "${IDF_TARGET}"
          tools/ci/idf-docker.sh . -- -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.ota" build

      - name: Upload OTA firmware artifacts
        uses: actions/upload-artifact@v3
        with:
          name: firmware-ota-${{ env.IDF_TARGET }}
          path: |
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
          if-no-files-found: error

  release:
    name: Publish Gitea Release
    runs-on: ubuntu-latest
    needs: [firmware, firmware-ota]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужен для git log между тегами

      - name: Download firmware artifacts
        uses: actions/download-artifact@v3
        with:
          name: firmware-${{ env.IDF_TARGET }}
          path: dl/fw

      - name: Download OTA firmware artifacts
        uses: actions/download-artifact@v3
        with:
          name: firmware-ota-${{ env.IDF_TARGET }}
          path: dl/ota

      - name: Assemble release assets
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist

          # Factory/USB-прошивка (стандартная partition table)
          cp "$(find dl/fw -name embed-framework.bin | head -1)"   dist/embed-framework.bin
          cp "$(find dl/fw -name bootloader.bin | head -1)"         dist/bootloader.bin
          cp "$(find dl/fw -name partition-table.bin | head -1)"    dist/partition-table.bin
          cp "$(find dl/fw -name flasher_args.json | head -1)"      dist/flasher_args.json

          # OTA-образ: app, собранный с partitions_ota.csv
          cp "$(find dl/ota -name embed-framework.bin | head -1)"   dist/embed-framework-ota.bin

          tar -C dist -cjf "dist/embed-framework-${TAG}-flash.tar.bz2" \
            bootloader.bin partition-table.bin embed-framework.bin flasher_args.json
          tar -C dist -cjf "dist/embed-framework-${TAG}-ota.tar.bz2" \
            bootloader.bin partition-table.bin embed-framework-ota.bin
          ls -la dist

      - name: Build release notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "${PREV_TAG}" ]; then
            CHANGES="$(git log --no-merges --pretty='- %s (%h)' "${PREV_TAG}..${TAG}")"
            COMPARE="${{ github.server_url }}/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          else
            CHANGES="$(git log --no-merges --pretty='- %s (%h)' -50)"
            COMPARE=""
          fi
          {
            echo "## embed-framework ${TAG}"
            echo
            echo "### Изменения"
            echo "${CHANGES:-— список изменений пуст}"
            echo
            echo "### Артефакты"
            echo "- \`embed-framework-${TAG}-flash.tar.bz2\` — bootloader + partition-table + app + flasher_args для первичной USB-прошивки"
            echo "- \`embed-framework-ota.bin\` / \`embed-framework-${TAG}-ota.tar.bz2\` — образ для OTA-обновления (partitions_ota.csv)"
            if [ -n "${COMPARE}" ]; then
              echo
              echo "[Полный список изменений](${COMPARE})"
            fi
          } > NOTES.md
          cat NOTES.md