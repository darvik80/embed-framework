# GitHub Actions — публикация релиза при пуше тега v*
#
# release: сборка прошивок (flashable + OTA) и публикация GitHub Release
#          через softprops/action-gh-release (использует GITHUB_TOKEN).
#
# GitHub сам помечает свежий релиз как «Latest», поэтому перемещаемый тег
# latest (как в Gitea-версии) здесь не нужен.
# Отдельная конфигурация от .gitea/workflows — не синхронизируется вручную.

name: Release (GitHub)

on:
  push:
    tags:
      - "v*"

env:
  IDF_TARGET: esp32s3
  IDF_IMAGE: espressif/idf:v5.5.1

permissions:
  contents: write # нужно для создания релиза и загрузки ассетов

jobs:
  release:
    name: Build firmware & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужен для git log между тегами

      - name: Ensure IDF docker helper
        run: |
          set -euo pipefail
          test -f tools/ci/idf-docker.sh
          chmod +x tools/ci/idf-docker.sh

      # ── 1. Flashable-сборка (стандартные partition table) ─────────
      - name: Build firmware (flashable)
        run: |
          tools/ci/idf-docker.sh . -- set-target "${IDF_TARGET}"
          tools/ci/idf-docker.sh . -- build

      - name: Collect flashable artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/bootloader/bootloader.bin \
             build/partition_table/partition-table.bin \
             build/embed-framework.bin \
             build/embed-framework.elf \
             build/embed-framework.map \
             build/flasher_args.json dist/
          tar -C dist -cjf "dist/embed-framework-${GITHUB_REF_NAME}-flash.tar.bz2" \
            bootloader.bin partition-table.bin embed-framework.bin \
            embed-framework.elf embed-framework.map flasher_args.json

      # ── 2. OTA-сборка (partitions_ota.csv) — чистый build/ ────────
      - name: Build firmware (OTA partitions)
        run: |
          set -euo pipefail
          rm -rf build
          tools/ci/idf-docker.sh . -- set-target "${IDF_TARGET}"
          tools/ci/idf-docker.sh . -- -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.ota" build

      - name: Collect OTA artifacts
        run: |
          set -euo pipefail
          cp build/ota_app_image.bin dist/embed-framework-ota.bin
          tar -C build -cjf dist/embed-framework-ota_artifacts.tar.bz2 \
            bootloader partition_table ota_app_image.bin \
            flash_args flasher_args.json sdkconfig
          ls -la dist

      # ── 3. Notes из git log между предыдущим тегом и текущим ─────
      - name: Build release notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "${PREV_TAG}" ]; then
            CHANGES="$(git log --no-merges --pretty='- %s (%h)' "${PREV_TAG}..${TAG}")"
            COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
          else
            CHANGES="$(git log --no-merges --pretty='- %s (%h)' -50)"
            COMPARE=""
          fi
          {
            echo "## embed-framework ${TAG}"
            echo
            echo "### Изменения"
            echo "${CHANGES:-— список изменений пуст}"
            echo
            echo "### Артефакты"
            echo "- \`embed-framework-${TAG}-flash.tar.bz2\` — bootloader + partition-table + app + elf/map для первичной прошивки"
            echo "- \`embed-framework-ota.bin\` — образ для OTA-обновления (partitions_ota.csv)"
            echo "- \`embed-framework-ota_artifacts.tar.bz2\` — полная OTA-сборка (sdkconfig, flash_args)"
            if [ -n "${COMPARE}" ]; then
              echo
              echo "[Полный список изменений](${COMPARE})"
            fi
          } > NOTES.md
          cat NOTES.md

      # ── 4. Публикация GitHub Release ─────────────────────────────
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: embed-framework ${{ github.ref_name }}
          body_path: NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
